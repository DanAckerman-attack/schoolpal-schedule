name: 更新课表

on:
  schedule:
    # UTC 23:30 = 北京时间次日 07:30
    - cron: '30 23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    # 保活心跳的提交只动 .keepalive，不触发课表刷新
    paths-ignore:
      - '.keepalive/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 拉取校宝三校区课表
        env:
          SP_PHONE: ${{ secrets.SP_PHONE }}
          SP_PASS: ${{ secrets.SP_PASS }}
          # 微信通知：二选一，配了哪个就用哪个；都没配则自动跳过
          SC_SENDKEY: ${{ secrets.SC_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: node refresh.mjs

      - name: 检查产物
        run: |
          test -f public/index.html || { echo "未生成 public/index.html"; exit 1; }
          echo "页面大小: $(wc -c < public/index.html) 字节"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
